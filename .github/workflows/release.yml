name: Build plugin

on:
  # Push a tag like v0.3.0 to build the zip and publish it as a GitHub Release.
  push:
    tags: ["v*"]
  # Or run it by hand from the Actions tab to get the zip as a build artifact (no release).
  workflow_dispatch:

# Nothing by default; the job below asks only for what it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release
      id-token: write      # sign the build attestation (Sigstore)
      attestations: write  # store the build attestation
    steps:
      # Third-party actions are pinned to full commit SHAs, so a moved or hijacked tag can't
      # change what runs here. Dependabot (.github/dependabot.yml) proposes updates as PRs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle and the downloaded Android Studio between runs, and validates the
      # checksum of gradle/wrapper/gradle-wrapper.jar against Gradle's official list.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build plugin zip
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            ./gradlew buildPlugin -PpluginVersion="${GITHUB_REF_NAME#v}"
          else
            ./gradlew buildPlugin
          fi

      - name: Compute SHA-256
        run: |
          cd plugin/build/distributions
          sha256sum *.zip | tee SHA256SUMS.txt

      # Signed provenance: proves the zip was built by this workflow from this repo's code.
      # Verify with: gh attestation verify <zip> -R <owner>/<repo>
      # GitHub only supports this on public repos (or Enterprise), so it's skipped while private.
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: plugin/build/distributions/*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-zip
          path: |
            plugin/build/distributions/*.zip
            plugin/build/distributions/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            plugin/build/distributions/*.zip
            plugin/build/distributions/SHA256SUMS.txt
          generate_release_notes: true
