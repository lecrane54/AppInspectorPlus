name: Build plugin

on:
  # Push a tag like v0.3.0 to build the zip and publish it as a GitHub Release.
  push:
    tags: ["v*"]
  # Or run it by hand from the Actions tab to get the zip as a build artifact (no release).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle and the downloaded Android Studio between runs.
      - uses: gradle/actions/setup-gradle@v5

      - name: Build plugin zip
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            ./gradlew buildPlugin -PpluginVersion="${GITHUB_REF_NAME#v}"
          else
            ./gradlew buildPlugin
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: plugin/build/distributions/*.zip

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: plugin/build/distributions/*.zip
          generate_release_notes: true
