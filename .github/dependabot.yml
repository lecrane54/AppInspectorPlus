# Proposes updates as pull requests, so new versions of the SHA-pinned actions and Gradle
# dependencies are reviewed before they run.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
    ignore:
      # Kotlin must match the version bundled with the targeted Android Studio
      # (2025.3 ships Kotlin 2.2), so only patch releases are proposed.
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
